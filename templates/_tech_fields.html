{# The five technician fields. Needs: field_statuses (list), and optionally o (an existing work order). #}
<div class="col-12"><label class="form-label">Case status</label>
  <select class="form-select" name="status" required {{ 'disabled' if status_locked }}>
    {% for s in field_statuses %}<option value="{{ s }}" {{ 'selected' if o and s == o.status }}>{{ s }}</option>{% endfor %}
  </select>
  {% if status_locked %}<div class="hint mt-1">The engineer controls the status at this stage ({{ o.status }}).</div>{% endif %}</div>
<div class="col-12"><label class="form-label">Findings</label>
  <textarea class="form-control" name="findings" rows="3" maxlength="2200" placeholder="What did you find?">{{ o.findings if o and o.findings }}</textarea></div>
<div class="col-12"><label class="form-label">Actions taken</label>
  <textarea class="form-control" name="actions_taken" rows="3" maxlength="2200" placeholder="What did you do?">{{ o.actions_taken if o and o.actions_taken }}</textarea></div>
<div class="col-md-8"><label class="form-label">Parts used</label>
  <input class="form-control" name="parts" maxlength="300" placeholder="e.g. Air filter, 2 spark plugs" value="{{ o.parts if o and o.parts != 'None documented' }}"></div>
<div class="col-md-4"><label class="form-label">Hours spent</label>
  <input class="form-control" name="hours" type="number" step="0.25" min="0" max="1000" value="{{ o.hours if o else 0 }}"></div>
